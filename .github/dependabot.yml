version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      testing-library:
        patterns: ['@testing-library/*']
      babel-compatible:
        patterns: ['@babel/*']
        update-types: [minor, patch]
      jest-toolchain:
        patterns: ['babel-jest', 'jest', 'jest-environment-jsdom']
      react-runtime:
        patterns: ['react', 'react-dom']
    ignore:
      # React 19 removes UMD builds; migrate the public build before a major upgrade.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      # Babel 8 needs a coordinated ESM build/test migration; keep routine updates on Babel 7.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/preset-env'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/preset-react'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      official-actions:
        patterns: ['actions/*']
