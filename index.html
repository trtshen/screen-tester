<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Screen Tester</title>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'">
	<script src="assets/react.production.min.js"></script>
	<script src="assets/react-dom.production.min.js"></script>

	<style>
		body, html {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
		}

		#background {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
		}

		.test { position: fixed; inset: 12px 12px auto auto; max-width: min(360px, calc(100vw - 24px)); z-index: 2; }
        .controls { background: rgba(255,255,255,0.96); color: #222; padding: 12px; border-radius: 6px; }
        .controls p { margin: 0 0 8px; }
        .custom-button:focus-visible { outline: 3px solid #0645ad; }
        .controls:focus-within { opacity: 1; pointer-events: auto; }
        .hidden-button { pointer-events: none; }
        .stop-button { position: fixed; right: 12px; bottom: 12px; z-index: 2000; }

		.custom-button { 
			display: inline-block;
			padding: 6px 12px;
			margin-bottom: 0;
			font-size: 14px;
			font-weight: 400;
			line-height: 1.42857143;
			text-align: center;
			white-space: nowrap;
			vertical-align: middle;
			cursor: pointer;
			user-select: none;
			background-image: none;
			border: 1px solid transparent;
			border-radius: 4px;
			color: #333;
			background-color: #fff;
			border-color: #ccc;
		}

		.custom-button:hover {
			color: #333;
			background-color: #e6e6e6;
			border-color: #adadad;
		}

		.hidden-button {
			opacity: 0;
			transition: opacity 0.3s ease;
		}

		.visible-button {
			opacity: 1;
			transition: opacity 0.3s ease;
		}

		.show-grid::after {
			content: '';
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-image: 
				linear-gradient(rgba(255,255,255,0.2) 1px, transparent 1px),
				linear-gradient(90deg, rgba(255,255,255,0.2) 1px, transparent 1px);
			background-size: 20px 20px;
			pointer-events: none;
			z-index: 1000;
		}

		.show-crosshair::before {
			content: '';
			position: fixed;
			top: 50%;
			left: 50%;
			width: 100%;
			height: 100%;
			background-image:
				linear-gradient(0deg, transparent calc(50% - 1px), white calc(50% - 1px), white calc(50% + 1px), transparent calc(50% + 1px)),
				linear-gradient(90deg, transparent calc(50% - 1px), white calc(50% - 1px), white calc(50% + 1px), transparent calc(50% + 1px));
			transform: translate(-50%, -50%);
			pointer-events: none;
			z-index: 1001;
		}

		/* Motion Test Animations */
		@keyframes bouncing-box {
			0% { transform: translate(0px, -50%); }
			25% { transform: translate(calc(100vw - 100px), -50%); }
			50% { transform: translate(calc(100vw - 100px), -50%); }
			75% { transform: translate(0px, -50%); }
			100% { transform: translate(0px, -50%); }
		}

		@keyframes horizontal-scroll {
			0% { background-position-x: 0px; }
			100% { background-position-x: 100px; }
		}

		@keyframes vertical-scroll {
			0% { background-position-y: 0px; }
			100% { background-position-y: 50px; }
		}

		@keyframes diagonal-scroll {
			0% { background-position: 0px 0px; }
			100% { background-position: 56.568542px -56.568542px; }
		}

		/* Flicker Test Animations */
		@keyframes rapid-flicker {
			0% { background-color: black; }
			50% { background-color: white; }
			100% { background-color: black; }
		}

		@keyframes slow-flicker {
			0% { background-color: black; }
			50% { background-color: white; }
			100% { background-color: black; }
		}

		@keyframes ultra-rapid-flicker {
			0% { background-color: black; }
			50% { background-color: white; }
			100% { background-color: black; }
		}

		/* Motion Test Elements */
		.bouncing-box::after {
			content: '';
			position: absolute;
			top: 50%;
			left: 0;
			width: 100px;
			height: 100px;
			background-color: red;
			transform: translateY(-50%);
			animation: bouncing-box 2s infinite linear;
		}

		.scrolling-horizontal {
			background: repeating-linear-gradient(90deg, red 0px, red 50px, blue 50px, blue 100px);
			background-size: 100px 100%;
            animation: horizontal-scroll 1s infinite linear;
		}

		.scrolling-vertical {
			background: repeating-linear-gradient(0deg, green 0px, green 25px, white 25px, white 50px);
			background-size: 100% 50px;
            animation: vertical-scroll 1s infinite linear;
		}

		.scrolling-diagonal {
			background: repeating-linear-gradient(45deg, black 0px, black 10px, white 10px, white 20px);
			background-size: 56.568542px 56.568542px;
            animation: diagonal-scroll 2s infinite linear;
		}

		/* Flicker Test Classes */
		.flicker-slow {
			animation: slow-flicker 1s infinite steps(1, end);
		}

		.flicker-medium {
			animation: rapid-flicker 0.5s infinite steps(1, end);
		}

		.flicker-fast {
			animation: ultra-rapid-flicker 0.1s infinite steps(1, end);
		}
	</style>
</head>
<body>
	<div id="background"></div>
	<div id="content"></div>
	<script src="assets/app.js"></script>
</body>
</html>
